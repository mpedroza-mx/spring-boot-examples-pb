groups:
  - name: spring_boot_solr_movies_search_service
    rules:
      - alert: spring_boot_solr_movies_search_service_up_down
        expr: up{job="spring_boot_solr_movies_search_service"} == 0
        for: 1m
        labels:
            service: spring_boot_solr_movies_search_service
            severity: critical
        annotations:
            summary: "Spring Boot instance is down"
            description: "The instance *{{ $labels.instance }}* has been offline for more than 1 minute."
      - alert: spring_boot_solr_movies_search_service_latency
        expr: (sum(rate(http_server_requests_seconds_sum{uri="/api/movies/search"}[5m])) / sum(rate(http_server_requests_seconds_count{uri="/api/movies/search"}[5m]))) > 3
        for: 1m
        labels:
          service: spring_boot_solr_movies_search_service
          severity: warning
        annotations:
          summary: "/api/movies/search latency issue"
          description: "In the last 5 minutes the endpoint /api/movies/search some request are taking more than 3 seconds"
      - alert: spring_boot_solr_movies_search_service_high_request_rate
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/movies/search"}[1m])) > 500
        for: 30s
        labels:
          service: spring_boot_solr_movies_search_service
          severity: warning
        annotations:
          summary: "High Request Rate on endpoint /api/movies/search"
          description: "Request rate is {{ $value | printf \"%.0f\" }} req/s"
  - name: solr
    rules:
      - alert: solr_up_down
        expr: up{job="solr"} == 0
        for: 1m
        labels:
          service: solr
          severity: critical
        annotations:
          summary: "Solr is down"
          description: "The instance *{{ $labels.instance }}* has been offline for more than 1 minute."